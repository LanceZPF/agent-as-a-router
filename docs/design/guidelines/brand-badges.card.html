<!-- @dsCard group="Brand" viewport="700x150" name="Status Badges" subtitle="OK / WARNING / CRITICAL tags used in Governance & routing logs" -->
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:18px;box-sizing:border-box;display:flex;gap:10px;align-items:center;height:114px;">
  <span style="background:#10b9811a;color:var(--status-ok-text);border:1px solid #10b98140;font-size:11px;font-weight:600;padding:3px 9px;border-radius:4px;letter-spacing:.03em;">OK</span>
  <span style="background:var(--state-hover-amber);color:var(--status-warn-text);border:1px solid var(--border-warning);font-size:11px;font-weight:600;padding:3px 9px;border-radius:4px;letter-spacing:.03em;">WARNING</span>
  <span style="background:var(--state-hover-red);color:var(--status-critical-text);border:1px solid var(--border-critical);font-size:11px;font-weight:600;padding:3px 9px;border-radius:4px;letter-spacing:.03em;">CRITICAL</span>
  <span style="background:var(--state-hover-amber);color:var(--status-warn-text);border:1px solid var(--border-warning);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:16px;">⚠ FALLBACK</span>
</body></html>
