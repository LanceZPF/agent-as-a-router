<!-- @dsCard group="Spacing" viewport="700x120" name="Corner Radii" subtitle="sm / md / lg / full — a small restrained set" -->
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:18px;box-sizing:border-box;display:flex;gap:20px;align-items:center;height:84px;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:56px;height:36px;background:var(--slate-700);border-radius:var(--radius-sm);"></div><span style="color:var(--text-tertiary);font-size:10px;">sm 2px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:56px;height:36px;background:var(--slate-700);border-radius:var(--radius-md);"></div><span style="color:var(--text-tertiary);font-size:10px;">md 4px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:56px;height:36px;background:var(--slate-700);border-radius:var(--radius-lg);"></div><span style="color:var(--text-tertiary);font-size:10px;">lg 8px</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:36px;height:36px;background:var(--slate-700);border-radius:var(--radius-full);"></div><span style="color:var(--text-tertiary);font-size:10px;">full</span></div>
</body></html>
