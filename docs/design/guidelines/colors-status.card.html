<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Status" subtitle="OK / warning / critical / info — text and fill pairs" -->
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px;box-sizing:border-box;">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;height:110px;">
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="height:36px;border-radius:6px;background:var(--status-ok-fill)"></div>
    <div style="color:var(--status-ok-text);font-size:13px;font-weight:600;">OK · emerald</div>
    <div style="color:var(--text-tertiary);font-size:11px;font-family:var(--font-mono)">#34d399 / #10b981</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="height:36px;border-radius:6px;background:var(--status-warn-fill)"></div>
    <div style="color:var(--status-warn-text);font-size:13px;font-weight:600;">Warning · amber</div>
    <div style="color:var(--text-tertiary);font-size:11px;font-family:var(--font-mono)">#fbbf24 / #f59e0b</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="height:36px;border-radius:6px;background:var(--status-critical-fill)"></div>
    <div style="color:var(--status-critical-text);font-size:13px;font-weight:600;">Critical · red</div>
    <div style="color:var(--text-tertiary);font-size:11px;font-family:var(--font-mono)">#f87171 / #ef4444</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="height:36px;border-radius:6px;background:var(--sky-400)"></div>
    <div style="color:var(--status-info-text);font-size:13px;font-weight:600;">Info / Accent · sky</div>
    <div style="color:var(--text-tertiary);font-size:11px;font-family:var(--font-mono)">#38bdf8</div>
  </div>
</div>
</body></html>
