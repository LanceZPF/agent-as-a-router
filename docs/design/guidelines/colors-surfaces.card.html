<!-- @dsCard group="Colors" viewport="700x130" name="Surfaces & Borders" subtitle="Page / card / hover / track layering" -->
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:16px;box-sizing:border-box;display:flex;gap:12px;">
  <div style="flex:1;background:var(--surface-page);border:1px solid var(--border-default);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font-size:12px;">page #0f172a</div>
  <div style="flex:1;background:var(--surface-card);border:1px solid var(--border-default);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-primary);font-size:12px;">card #1e293b</div>
  <div style="flex:1;background:var(--surface-card-hover);border:1px solid var(--border-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-primary);font-size:12px;">hover #263548</div>
  <div style="flex:1;background:var(--surface-track);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:12px;">track #1e3a5f</div>
</body></html>
